<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nibbles</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Off-canvas section navigation (filled in by js/index.js) -->
<div id="nav-overlay" class="nav-overlay" hidden></div>
<nav id="section-nav" class="drawer" aria-label="Product sections" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-title">Sections</span>
    <button id="nav-close" class="nav-close" aria-label="Close menu">✕</button>
  </div>
  <ul id="nav-list" class="nav-list"></ul>
  <p class="nav-disclaimer">Currently delivering only in Mumbai region</p>
</nav>

<!-- Contact strip -->
<div class="contact-bar">
  <span>For orders &amp; queries:</span>
  <a href="tel:+917021553995">+91&nbsp;7021553995</a>
  <span class="sep">/</span>
  <a href="tel:+919819007222">+91&nbsp;9819007222</a>
</div>

<!-- Sticky top bar: menu, search, cart -->
<div class="topbar">
  <button id="nav-toggle" class="nav-toggle" aria-label="Open sections menu"
          aria-controls="section-nav" aria-expanded="false">
    <span class="burger"></span>
  </button>

  <div class="search" role="search">
    <input id="search-input" class="search-input" type="search"
           placeholder="Search products…" autocomplete="off"
           aria-label="Search products" aria-expanded="false"
           aria-controls="search-suggestions" role="combobox" />
    <ul id="search-suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>

  <a href="cart.html" class="cart-btn-top" aria-label="View cart">
    🛒<span id="cart-count" class="badge">0</span>
  </a>
</div>

<header>
  <a href="index.html" class="logo-link" aria-label="Nibbles home">
    <img src="images/logo.png" alt="Nibbles by N.A. Traders" class="logo"
         width="62" height="62"
         onerror="this.closest('.logo-link').style.display='none'" />
  </a>
  <h1>NIBBLES</h1>
  <p class="byline">By N.A. TRADERS</p>
  <p>Premium Quality, Globally Sourced &amp; Imported.</p>
</header>

<main>
  <div id="catalog">
    <p class="muted">Loading current prices...</p>
  </div>
  <p id="updated-at" class="muted small"></p>
</main>

<button id="to-top" class="to-top" aria-label="Scroll to top" title="Scroll to top" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
    <path d="M12 5l-7 7h4v7h6v-7h4z" fill="currentColor" />
  </svg>
</button>

<script src="js/config.js"></script>
<script src="js/image-manifest.js"></script>
<script src="js/store.js"></script>
<script src="js/index.js"></script>
</body>
</html>
